# サイト設定
title: "Java Standardization & Education Lab"
description: "ソフトウェアアーキテクチャ | プログラミング技術標準化 | プログラミング教育 | 生成AI・Event-Driven Architecture"

baseurl: ""
url: "https://k-jinma.github.io" # 公開URL（独自ドメイン設定後に変更）

# Just the Docsテーマ
remote_theme: just-the-docs/just-the-docs

# 検索機能
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  button: true

# ナビゲーション
nav_sort: case_insensitive
nav_external_links:
  - title: note
    url: https://note.com/your-account
    hide_icon: false

# コード関連
enable_copy_code_button: true
highlighter: rouge

# カラーテーマ
color_scheme: light

# フッター
footer_content: "Copyright &copy; 2026 あなたの名前. All rights reserved."

# プラグイン
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
